<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title description">
  <title id="title">WavRead luminous cyan waveform icon</title>
  <desc id="description">A faithful vector recreation of the current WavRead icon: layered cyan and blue waveform shapes reflected across a central signal line inside a dark rounded-square container.</desc>

  <defs>
    <!-- Container -->
    <linearGradient id="containerFill" x1="0" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#1A2027"/>
      <stop offset="0.34" stop-color="#0E141A"/>
      <stop offset="1" stop-color="#02070C"/>
    </linearGradient>
    <linearGradient id="containerEdge" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#617080" stop-opacity="0.72"/>
      <stop offset="0.18" stop-color="#26313C" stop-opacity="0.56"/>
      <stop offset="0.72" stop-color="#071019" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3B4A59" stop-opacity="0.58"/>
    </linearGradient>
    <radialGradient id="topSheen" cx="50%" cy="-6%" r="78%">
      <stop offset="0" stop-color="#647382" stop-opacity="0.22"/>
      <stop offset="0.42" stop-color="#28323C" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#02070C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerLift" cx="50%" cy="49%" r="58%">
      <stop offset="0" stop-color="#17242D" stop-opacity="0.36"/>
      <stop offset="0.5" stop-color="#071019" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000309" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edgeVignette" cx="50%" cy="48%" r="67%">
      <stop offset="0.63" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.52"/>
    </radialGradient>

    <!-- Signal fills -->
    <linearGradient id="primaryUpper" x1="0" y1="0.15" x2="1" y2="0.88">
      <stop offset="0" stop-color="#00C3D8"/>
      <stop offset="0.3" stop-color="#00D5CC"/>
      <stop offset="0.58" stop-color="#00B9B6"/>
      <stop offset="0.82" stop-color="#00BEBB"/>
      <stop offset="1" stop-color="#078EB4"/>
    </linearGradient>
    <linearGradient id="primaryLower" x1="0.08" y1="0.1" x2="0.9" y2="0.92">
      <stop offset="0" stop-color="#04C8E7"/>
      <stop offset="0.48" stop-color="#0A83FF"/>
      <stop offset="0.78" stop-color="#0756F0"/>
      <stop offset="1" stop-color="#0827AF"/>
    </linearGradient>
    <linearGradient id="secondaryUpper" x1="0.08" y1="0.12" x2="0.92" y2="0.88">
      <stop offset="0" stop-color="#16D9E5" stop-opacity="0.68"/>
      <stop offset="0.48" stop-color="#12CDD6" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#0086C7" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="secondaryLower" x1="0.08" y1="0.08" x2="0.92" y2="0.94">
      <stop offset="0" stop-color="#0BB5E5" stop-opacity="0.57"/>
      <stop offset="0.52" stop-color="#087DD5" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#032B76" stop-opacity="0.44"/>
    </linearGradient>
    <linearGradient id="signalHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00A9C9" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#00B5D2" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#00B9D8" stop-opacity="0.9"/>
      <stop offset="0.82" stop-color="#008DC6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0878BB" stop-opacity="0"/>
    </linearGradient>

    <!-- Reusable vector traces; the lower halves reuse these paths by reflection. -->
    <path id="primaryTrace" d="M70 640
      C151 640 210 636 255 571
      C287 524 302 367 355 367
      C419 367 420 583 463 630
      C480 650 501 609 522 508
      C548 379 558 205 621 205
      C685 205 694 507 726 585
      C744 629 764 650 782 639
      C823 613 842 380 922 380
      C998 380 1010 598 1073 629
      C1115 649 1170 641 1202 640
      L70 640 Z"/>
    <path id="secondaryTrace" d="M76 640
      C154 639 174 616 207 556
      C229 515 251 503 281 514
      C340 535 366 637 431 640
      C480 642 497 543 527 471
      C549 418 568 405 592 418
      C625 436 628 615 649 638
      C666 656 657 449 689 429
      C729 404 746 605 800 637
      C853 669 910 604 956 553
      C1017 486 1063 507 1094 568
      C1119 617 1154 638 1200 640
      L76 640 Z"/>

    <clipPath id="iconClip">
      <rect x="7" y="5" width="1240" height="1242" rx="248"/>
    </clipPath>
    <filter id="signalGlow" x="-14%" y="-20%" width="128%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- The source PNG has an opaque black canvas, so the review SVG preserves it. -->
  <rect width="1254" height="1254" fill="#000000"/>

  <g clip-path="url(#iconClip)">
    <rect x="7" y="5" width="1240" height="1242" rx="248" fill="url(#containerFill)"/>
    <rect x="7" y="5" width="1240" height="1242" rx="248" fill="url(#topSheen)"/>
    <rect x="7" y="5" width="1240" height="1242" rx="248" fill="url(#centerLift)"/>

    <!-- A restrained bloom sits behind the vector signal rather than replacing it. -->
    <g opacity="0.32" filter="url(#signalGlow)">
      <use href="#primaryTrace" fill="#00D8D0"/>
      <use href="#primaryTrace" transform="translate(0 1282) scale(1 -1)" fill="#0879FF"/>
    </g>

    <g id="analysis-signal">
      <g id="secondary-wave">
        <use href="#secondaryTrace" fill="url(#secondaryUpper)"/>
        <use href="#secondaryTrace" transform="translate(0 1282) scale(1 -1)" fill="url(#secondaryLower)"/>
      </g>

      <g id="primary-wave">
        <use href="#primaryTrace" fill="url(#primaryUpper)"/>
        <use href="#primaryTrace" transform="translate(0 1282) scale(1 -1)" fill="url(#primaryLower)"/>
      </g>

      <!-- Transparent overlays reproduce the layered/reflected depth in the source. -->
      <use href="#secondaryTrace" fill="#44F1E7" opacity="0.18"/>
      <use href="#secondaryTrace" transform="translate(0 1282) scale(1 -1)" fill="#14A5FF" opacity="0.16"/>

      <path d="M72 640.1 C280 638.8 420 641.2 621 640.1 C824 639 1007 641.4 1203 640.1"
        fill="none" stroke="url(#signalHighlight)" stroke-width="1.6"/>
    </g>

    <rect x="7" y="5" width="1240" height="1242" rx="248" fill="url(#edgeVignette)" pointer-events="none"/>
  </g>

  <!-- Fine container edges recreate the source icon's metallic top and cool lower rim. -->
  <rect x="8.5" y="6.5" width="1237" height="1239" rx="246.5" fill="none" stroke="url(#containerEdge)" stroke-width="1.8"/>
</svg>
